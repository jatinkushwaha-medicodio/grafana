# Grafana datasource provisioning — applied on every container start. Hosts
# resolve via Docker Compose's built-in DNS (service name = hostname). Anyone
# editing in the UI is overridden on restart; commit changes here, not there.

apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 30s
      httpMethod: POST

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      maxLines: 5000
      derivedFields:
        - name: correlationId
          matcherRegex: '"correlationId":"([^"]+)"'
          datasourceUid: loki
          url: '${__value.raw}'

  # ── Per-env app-DB datasources for product-usage analytics ─────────────
  # One entry per environment. Populate the matching APP_DB_<ENV>_* vars in
  # .env.grafana on the monitoring VM (see monitoring/docker-compose.yml).
  # Blank creds leave the datasource registered but queries fail with "no
  # data" — safe. Dashboards pick which one via the `env_ds` template var.
  - name: Postgres (Dev)
    uid: postgres_dev
    type: postgres
    access: proxy
    url: ${APP_DB_DEV_HOST}:${APP_DB_DEV_PORT}
    database: ${APP_DB_DEV_NAME}
    user: ${APP_DB_DEV_ANALYTICS_USER}
    editable: false
    jsonData:
      sslmode: ${APP_DB_DEV_SSLMODE}
      postgresVersion: 1500
      timescaledb: false
    secureJsonData:
      password: ${APP_DB_DEV_ANALYTICS_PASSWORD}

  - name: Postgres (Uat)
    uid: postgres_uat
    type: postgres
    access: proxy
    url: ${APP_DB_UAT_HOST}:${APP_DB_UAT_PORT}
    database: ${APP_DB_UAT_NAME}
    user: ${APP_DB_UAT_ANALYTICS_USER}
    editable: false
    jsonData:
      sslmode: ${APP_DB_UAT_SSLMODE}
      postgresVersion: 1500
      timescaledb: false
    secureJsonData:
      password: ${APP_DB_UAT_ANALYTICS_PASSWORD}

  - name: Postgres (Prod)
    uid: postgres_prod
    type: postgres
    access: proxy
    url: ${APP_DB_PROD_HOST}:${APP_DB_PROD_PORT}
    database: ${APP_DB_PROD_NAME}
    user: ${APP_DB_PROD_ANALYTICS_USER}
    editable: false
    jsonData:
      sslmode: ${APP_DB_PROD_SSLMODE}
      postgresVersion: 1500
      timescaledb: false
    secureJsonData:
      password: ${APP_DB_PROD_ANALYTICS_PASSWORD}
