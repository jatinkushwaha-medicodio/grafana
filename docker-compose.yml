# Medicodio monitoring stack — Grafana + Prometheus + Loki only.
#
# Local dev:  `docker compose up -d`
#   → also loads docker-compose.override.yml automatically, which wires
#     the local-only app-local scrape (host.docker.internal:8000).
#
# VM deploy:  `docker compose -f docker-compose.yml up -d`
#   → skips the override so no app-local scrape, no extra_hosts.
#   → only dev/uat/prod targets attempted (driven by targets/*.yml).
#
# All UI ports bind to 127.0.0.1 — put a reverse proxy in front for public
# access (Caddy / nginx). Never expose 3000/9090/3100 publicly.

name: medicodio-monitoring

services:
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: monitoring-prometheus
    restart: unless-stopped
    user: "65534:65534"
    # Lets the Prometheus container reach the VM host (where the dev + uat
    # app containers publish :8000 / :8001). Native on Mac/Windows;
    # `host-gateway` makes the same name work on Linux VMs too.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
    secrets:
      - dev_metrics_token
      - uat_metrics_token
      # - prod_metrics_token  # re-enable when PROD wiring lands
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Per-file mounts (not whole dir) so the local-only target file from the
      # repo never ships to the VM. Override file adds `app-local.yml` on dev
      # machines.
      - ./prometheus/targets/app-dev.yml:/etc/prometheus/targets/app-dev.yml:ro
      - ./prometheus/targets/app-uat.yml:/etc/prometheus/targets/app-uat.yml:ro
      # - ./prometheus/targets/app-prod.yml:/etc/prometheus/targets/app-prod.yml:ro
      - ./prometheus/targets/node-shared.yml:/etc/prometheus/targets/node-shared.yml:ro
      - prom-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - monitoring

  # Host metrics for the VM this stack runs on (CPU / mem / disk / uptime).
  # Reads /proc + /sys from the host via bind mounts. `pid: host` lets it see
  # every process, not just the ones inside its own PID namespace.
  #
  # Behind the `vm` profile so local `docker compose up -d` skips it
  # (macOS Docker Desktop rejects the rslave propagation and container
  # metrics against Docker Desktop's VM would be useless anyway).
  # VM deploy runs `docker compose --profile vm up -d`.
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: monitoring-node-exporter
    restart: unless-stopped
    pid: host
    profiles: ["vm"]
    command:
      - --path.rootfs=/host
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /:/host:ro,rslave
    ports:
      - "127.0.0.1:9100:9100"
    networks:
      - monitoring

  loki:
    image: grafana/loki:main-550f590
    container_name: monitoring-loki
    restart: unless-stopped
    user: "10001:10001"
    command:
      - -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:3033:3100"
    networks:
      - monitoring

  grafana:
    # 12.x required by grafanactl (CLI used in docs/dashboards.md).
    image: grafana/grafana:12.0.2
    container_name: monitoring-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
      - loki
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:?GF_ADMIN_PASSWORD must be set in .env}
      # Public Grafana URL used in OAuth callbacks. Empty = falls back to localhost.
      GF_SERVER_ROOT_URL: ${GF_SERVER_ROOT_URL:-http://localhost:3030}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_AUTO_ASSIGN_ORG_ROLE: Viewer
      # Community panels used by the Product Usage dashboard:
      #   - netsage-sankey-panel                  (P7 Area transitions)
      #   - marcusolsson-hourly-heatmap-panel     (P8 Peak hours grid — hour × weekday,
      #                                            native heatmap only does time-on-X)
      # Neither is signed by Grafana Labs; allow-list explicitly.
      GF_INSTALL_PLUGINS: netsage-sankey-panel,marcusolsson-hourly-heatmap-panel
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: netsage-sankey-panel,marcusolsson-hourly-heatmap-panel
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # Microsoft OAuth — populated from .env when team SSO is wired.
      GF_AUTH_GENERIC_OAUTH_ENABLED: ${GF_OAUTH_ENABLED:-false}
      GF_AUTH_GENERIC_OAUTH_NAME: Microsoft
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: ${GF_OAUTH_CLIENT_ID:-}
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: ${GF_OAUTH_CLIENT_SECRET:-}
      GF_AUTH_GENERIC_OAUTH_SCOPES: openid email profile
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: ${GF_OAUTH_AUTH_URL:-}
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: ${GF_OAUTH_TOKEN_URL:-}
      GF_AUTH_GENERIC_OAUTH_API_URL: ${GF_OAUTH_API_URL:-}
      GF_AUTH_GENERIC_OAUTH_ALLOW_ASSIGN_GRAFANA_ADMIN: "false"
      # Restrict sign-in to medicodio.ai company email addresses. Anyone with a
      # tenant account can auth via Microsoft, but Grafana rejects non-medicodio
      # domains at the last step.
      GF_AUTH_GENERIC_OAUTH_ALLOWED_DOMAINS: medicodio.ai
      # Everyone new lands as Viewer by default. Promote specific accounts to
      # Editor/Admin via Grafana UI → Users after their first login.
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_STRICT: "false"
      GF_USERS_AUTO_ASSIGN_ORG: "true"
      GF_AUTH_GENERIC_OAUTH_USE_PKCE: "true"
      # Single Teams webhook that receives every alert. Message body carries
      # the env label so DEV / UAT / PROD alerts land in the same channel.
      # Placeholder default keeps Grafana's alerting provisioner from crashing
      # on local/first-boot when no real webhook is set — resolves to a
      # non-routable URL. Set the real value on the VM.
      TEAMS_WEBHOOK_URL: ${TEAMS_WEBHOOK_URL:-https://example.invalid/none}
      # Per-env app-DB creds for product-usage analytics datasources.
      # Populate the ones you use in .env.grafana; blank leaves the datasource
      # registered but queries fail with "no data" — safe. Grafana picks a
      # single env via the dashboard's `env_ds` template variable, so a viewer
      # never sees cross-env data by accident.
      APP_DB_DEV_HOST: ${APP_DB_DEV_HOST:-}
      APP_DB_DEV_PORT: ${APP_DB_DEV_PORT:-5432}
      APP_DB_DEV_NAME: ${APP_DB_DEV_NAME:-}
      APP_DB_DEV_ANALYTICS_USER: ${APP_DB_DEV_ANALYTICS_USER:-}
      APP_DB_DEV_ANALYTICS_PASSWORD: ${APP_DB_DEV_ANALYTICS_PASSWORD:-}
      APP_DB_DEV_SSLMODE: ${APP_DB_DEV_SSLMODE:-require}

      APP_DB_UAT_HOST: ${APP_DB_UAT_HOST:-}
      APP_DB_UAT_PORT: ${APP_DB_UAT_PORT:-5432}
      APP_DB_UAT_NAME: ${APP_DB_UAT_NAME:-}
      APP_DB_UAT_ANALYTICS_USER: ${APP_DB_UAT_ANALYTICS_USER:-}
      APP_DB_UAT_ANALYTICS_PASSWORD: ${APP_DB_UAT_ANALYTICS_PASSWORD:-}
      APP_DB_UAT_SSLMODE: ${APP_DB_UAT_SSLMODE:-require}

      APP_DB_PROD_HOST: ${APP_DB_PROD_HOST:-}
      APP_DB_PROD_PORT: ${APP_DB_PROD_PORT:-5432}
      APP_DB_PROD_NAME: ${APP_DB_PROD_NAME:-}
      APP_DB_PROD_ANALYTICS_USER: ${APP_DB_PROD_ANALYTICS_USER:-}
      APP_DB_PROD_ANALYTICS_PASSWORD: ${APP_DB_PROD_ANALYTICS_PASSWORD:-}
      APP_DB_PROD_SSLMODE: ${APP_DB_PROD_SSLMODE:-require}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      # Host port 3030 to avoid the apps/web Next.js dev server on 3000.
      # Container still listens internally on 3000 (Grafana default).
      - "127.0.0.1:3030:3000"
    networks:
      - monitoring

networks:
  monitoring:
    driver: bridge

volumes:
  prom-data:
  loki-data:
  grafana-data:

# Per-env scrape tokens for Prometheus. Each is mounted at /run/secrets/<name>
# inside the prometheus container and referenced by `credentials_file` in
# prometheus.yml. Populated from .env. Empty value = empty file = target stays
# DOWN with auth error (harmless to other targets).
secrets:
  dev_metrics_token:
    environment: DEV_METRICS_TOKEN
  uat_metrics_token:
    environment: UAT_METRICS_TOKEN
  # prod_metrics_token:
  #   environment: PROD_METRICS_TOKEN
